name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GoDaddy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # -------------------------------------------------------
      # Laravel application
      # -------------------------------------------------------
      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp

          local-dir: ./
          server-dir: ./afriso-clinic/

          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**

            public/**

            tests/**
            docs/**

            storage/app/**
            storage/logs/**
            storage/framework/**

            bootstrap/cache/*.php

            phpunit.xml
            phpunit.xml.dist
            **/*.log

      # -------------------------------------------------------
      # Public domain directory
      # -------------------------------------------------------
      - name: Deploy public files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp

          local-dir: ./public/
          server-dir: ./public_html/clinic.afriso.so/

          dangerous-clean-slate: false

          exclude: |
            index.php
            .htaccess
            storage